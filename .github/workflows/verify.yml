name: Verify industrial monitor
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: C tests, Python parity and model consistency
        run: python3 scripts/verify.py
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build ESP32 firmware and UF2
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py -C firmware -DPROJECT_VER=0.1.0 build
          idf.py -C firmware uf2
      - uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          if-no-files-found: error
          path: |
            firmware/build/industrial_monitor.bin
            firmware/build/industrial_monitor.elf
            firmware/build/uf2.bin
            firmware/build/bootloader/bootloader.bin
            firmware/build/partition_table/partition-table.bin
            firmware/build/ota_data_initial.bin
